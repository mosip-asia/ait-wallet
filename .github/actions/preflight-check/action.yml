name: "Deployment Pre-flight Validation"
description: "Inspects required NetBird mesh and SSH deployment credentials and variables"
inputs:
  netbird-setup-key:
    description: "NetBird setup key"
    required: false
  ssh-private-key:
    description: "SSH private key content"
    required: false
  netbird-management-url:
    description: "NetBird self-hosted management URL"
    required: false
  server-host:
    description: "Target server hostname or mesh IP"
    required: false
  server-user:
    description: "SSH deploy user on target host"
    required: false
  server-project-dir:
    description: "Absolute project directory on target host"
    required: false

runs:
  using: "composite"
  steps:
    - name: Inspect Deployment Credentials & Variables
      shell: bash
      env:
        NETBIRD_KEY: ${{ inputs.netbird-setup-key }}
        SSH_KEY: ${{ inputs.ssh-private-key }}
        NETBIRD_MANAGEMENT_URL: ${{ inputs.netbird-management-url }}
        SERVER_HOST: ${{ inputs.server-host }}
        SERVER_USER: ${{ inputs.server-user }}
        SERVER_PROJECT_DIR: ${{ inputs.server-project-dir }}
      run: |
        echo "========================================================"
        echo "🔐 Deployment Secrets & Variables Pre-Flight Check"
        echo "========================================================"

        MISSING=0

        # Secrets validation
        if [ -z "$NETBIRD_KEY" ]; then
          echo "❌ MISSING SECRET: NETBIRD_SETUP_KEY"
          echo "   👉 Generate a Setup Key in NetBird and add it to GitHub Secrets."
          MISSING=1
        else
          echo "✅ FOUND SECRET: NETBIRD_SETUP_KEY (${#NETBIRD_KEY} chars)"
        fi

        if [ -z "$SSH_KEY" ]; then
          echo "❌ MISSING SECRET: SSH_PRIVATE_KEY"
          echo "   👉 Add your server SSH private key to GitHub Secrets."
          MISSING=1
        else
          echo "✅ FOUND SECRET: SSH_PRIVATE_KEY (${#SSH_KEY} chars)"
        fi

        # Variables validation
        if [ -z "$NETBIRD_MANAGEMENT_URL" ]; then
          echo "❌ MISSING VARIABLE: NETBIRD_MANAGEMENT_URL"
          echo "   👉 Set GitHub Variable: NETBIRD_MANAGEMENT_URL (e.g. https://netbird.your-domain.com)"
          MISSING=1
        else
          echo "✅ FOUND VARIABLE: NETBIRD_MANAGEMENT_URL = $NETBIRD_MANAGEMENT_URL"
        fi

        if [ -z "$SERVER_HOST" ]; then
          echo "❌ MISSING VARIABLE: SERVER_HOST"
          echo "   👉 Set GitHub Variable: SERVER_HOST (e.g. ait-itserv-vm or mesh IP)"
          MISSING=1
        else
          echo "✅ FOUND VARIABLE: SERVER_HOST = $SERVER_HOST"
        fi

        if [ -z "$SERVER_USER" ]; then
          echo "❌ MISSING VARIABLE: SERVER_USER"
          echo "   👉 Set GitHub Variable: SERVER_USER (e.g. ubuntu)"
          MISSING=1
        else
          echo "✅ FOUND VARIABLE: SERVER_USER = $SERVER_USER"
        fi

        if [ -z "$SERVER_PROJECT_DIR" ]; then
          echo "❌ MISSING VARIABLE: SERVER_PROJECT_DIR"
          echo "   👉 Set GitHub Variable: SERVER_PROJECT_DIR (e.g. /projects/ait-sis-adapter)"
          MISSING=1
        else
          echo "✅ FOUND VARIABLE: SERVER_PROJECT_DIR = $SERVER_PROJECT_DIR"
        fi

        echo "========================================================"

        if [ "$MISSING" -ne 0 ]; then
          echo ""
          echo "❌ ABORTING: Required deployment secrets or variables are missing!"
          echo "👉 Configure them in: Settings -> Secrets and variables -> Actions"
          exit 1
        fi

        echo "🎉 All required deployment credentials and variables are configured!"

