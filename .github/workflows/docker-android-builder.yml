name: 🐳 Build & Push Android Builder to GHCR

on:
  push:
    tags:
      - 'v*'
      - 'android-builder-v*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Image tag (defaults to latest if left blank)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: android-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: 🚀 Build & Push Android Builder
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-android-builder
          tags: |
            # SemVer tags on release (e.g., v1.2.3 -> 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

            # Latest tag on release tags
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

            # Git commit short SHA (e.g., sha-a1b2c3d)
            type=sha,format=short

            # Tag specified via manual workflow dispatch
            type=raw,value=${{ inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag != '' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/mobile
          file: ./apps/mobile/Dockerfile.android
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
