services:
  config-server:
    container_name: ait-bff-config-server
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - nginx            # some upstream props reference the host 'nginx'
    volumes:
      - ./config/mimoto-issuers-config.json:/config/server/mimoto-issuers-config.json:ro
      - ./config/mimoto-trusted-verifiers.json:/config/server/mimoto-trusted-verifiers.json:ro
      - ./config/credential-template.html:/config/server/credential-template.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  postgres:
    container_name: ait-bff-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # init SQL runs ONLY on first start (empty data dir). To re-init: compose down -v
      - ./mimoto_init.sql:/docker-entrypoint-initdb.d/mimoto_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mimoto:
    container_name: ait-wallet-bff
    image: ${MIMOTO_IMAGE:-injistack/mimoto:0.22.0}
    user: root
    restart: unless-stopped
    ports:
      - "${BFF_PORT:-8099}:8099"
    environment:
      - container_user=mosip
      - active_profile_env=default
      - SPRING_CONFIG_NAME=mimoto
      - SPRING_CONFIG_LOCATION=/home/mosip/
      - SPRING_CLOUD_BOOTSTRAP_LOCATION=/home/mosip/mimoto-bootstrap.properties
      - oidc_p12_password=${OIDC_P12_PASSWORD:-dummypassword}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inji_mimoto
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # placeholders — only used later for "Login with Google" (not Phase 1)
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-clientId}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-clientSecret}
    volumes:
      - ./config/mimoto-default.properties:/home/mosip/mimoto-default.properties:ro
      - ./config/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties:ro
      - ./config/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      # Mimoto persists generated keys here; keep this local keystore writable.
      # Generated by scripts/generate-keystore.sh — NEVER committed.
      - ./certs/oidckeystore.p12:/home/mosip/certs/oidckeystore.p12:rw
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8099/v1/mimoto/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 120s   # Mimoto JVM + keymanager init is slow on first boot

volumes:
  postgres-data:
