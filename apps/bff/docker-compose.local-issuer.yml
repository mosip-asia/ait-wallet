# Opt-in fictional issuer fixture. Use together with docker-compose.yml.
services:
  config-server:
    volumes:
      # Same container path as the base mount: Compose replaces it with the demo file.
      - ${LOCAL_ISSUER_CONFIG:-./config/mimoto-issuers-config.local.json}:/config/server/mimoto-issuers-config.json:ro

  mimoto:
    ports:
      - "${LOCAL_ISSUER_BIND_ADDRESS:-127.0.0.1}:${LOCAL_ISSUER_PORT:-8443}:8443"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/home/mosip/local-dev/cacerts
        -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - ${LOCAL_ISSUER_CONFIG:-./config/mimoto-issuers-config.local.json}:/home/mosip/mimoto-issuers-config.json:ro
      - ../../tools/local-issuer/state/mimoto-cacerts:/home/mosip/local-dev/cacerts:ro

  local-issuer:
    build: ../../tools/local-issuer
    user: "${LOCAL_ISSUER_UID:-501}:${LOCAL_ISSUER_GID:-20}"
    environment:
      LOCAL_ISSUER_ORIGIN: ${LOCAL_ISSUER_ORIGIN:-https://localhost:8443}
    network_mode: "service:mimoto"
    restart: unless-stopped
    depends_on:
      mimoto:
        condition: service_started
    volumes:
      - ../../tools/local-issuer/state/tls-key.pem:/state/tls-key.pem:ro
      - ../../tools/local-issuer/state/tls-cert.pem:/state/tls-cert.pem:ro
      - ../../tools/local-issuer/state/issuer-key.pem:/state/issuer-key.pem:ro
      - ../../tools/local-issuer/state/client-public.jwk:/state/client-public.jwk:ro
      - ../../tools/local-issuer/state/ca.pem:/state/ca.pem:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:8443/health',{ca:require('fs').readFileSync('/state/ca.pem')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Public development CA only; signing/client private keys are not shared.
