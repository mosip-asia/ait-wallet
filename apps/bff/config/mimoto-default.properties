# AIT Wallet — Remote Runtime Properties (/v1/mimoto/allProperties)
# Consumed by Inji Mobile on startup and cached per vcDownloadMaxRetry / cacheTTL.

mosip.inji.vcDownloadMaxRetry=10
mosip.inji.vcDownloadPoolInterval=6000
mosip.inji.audience=ida-binding
mosip.inji.issuer=residentapp
mosip.inji.warningDomainName=https://issuer.ait.ac.th
mosip.inji.aboutInjiUrl=https://id.ait.ac.th
mosip.inji.minStorageRequiredForAuditEntry=2
mosip.inji.minStorageRequired=2
mosip.inji.MinimumStorageLimitForBackup=5
mosip.inji.crypto.EnableArgon2iHashGenerator=true
mosip.inji.faceSdkModelUrl=https://api.qainji.mosip.net/inji
mosip.inji.CacheTTL=3600000
mosip.inji.livenessDetection=false
mosip.inji.livenessThreshold=0.4
